<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Agenda</title>
  <meta name="theme-color" content="#4f6bed">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Barra de módulos -->
    <nav class="rail" aria-label="Módulos">
      <div class="rail-logo" title="Mi Agenda">✓</div>
      <button class="rail-btn active" data-view="tasks" title="Tareas"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg><span>Tareas</span></button>
      <button class="rail-btn" data-view="calendar" title="Calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></button>
      <button class="rail-btn" data-view="matrix" title="Matriz Eisenhower"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Matriz</span></button>
      <button class="rail-btn" data-action="search" title="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-action="settings" title="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Ajustes</span></button>
    </nav>

    <!-- Panel de listas (solo vista Tareas) -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Contenido principal -->
    <main class="main" id="main"></main>

    <!-- Detalle de tarea -->
    <section class="detail" id="detail" aria-label="Detalle de tarea"></section>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
